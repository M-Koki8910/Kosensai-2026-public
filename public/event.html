                "map": "",
                "location": "図書館"

        ];

        const eventGrid = document.getElementById('event-grid');

        function parseEventStartMinutes(timeText) {
            const match = String(timeText || '').match(/(\d{1,2}):(\d{2})/);
            if (!match) return Number.MAX_SAFE_INTEGER;
            return Number(match[1]) * 60 + Number(match[2]);
        }

        function createEventCard(event) {

            const card = document.createElement('div');
            card.className = 'card event-card';
            card.dataset.eventLocation = event.location === '体育館'
                ? 'gym'
                : 'courtyard';

            const productDisplay = event.product.length > 30
                ? event.product.substring(0, 30) + '...'
                : event.product;

            card.innerHTML = `
        <img src="${event.image}" alt="${event.name}">
        <div class="card-body">
            <h3>${event.name}</h3>
        </div>
        <div class="detail" title="${event.product}">
            ${productDisplay}
        </div>
    `;

            card.addEventListener('click', () => openEventModal(event));

            return card;
        }

        function renderEventGroups() {
            eventGrid.innerHTML = '';

            const locationLabels = {
                '体育館': '第一体育館',
                '学びの庭': '学びの庭',
                '図書館': '図書館'
            };

            [1, 2].forEach(day => {
                const locationOrder = day === 2
                    ? ['体育館', '学びの庭', '図書館']
                    : ['体育館', '学びの庭'];
                const section = document.createElement('section');
                section.className = 'event-day-section';

                const heading = document.createElement('h3');
                heading.className = 'event-day-heading';
                heading.textContent = `${day}日目`;
                section.appendChild(heading);

                locationOrder.forEach(location => {
                    const locationEvents = events
                        .filter(event => Number(event.day) === day && event.location === location)
                        .sort((a, b) => parseEventStartMinutes(a.time) - parseEventStartMinutes(b.time));

                    if (locationEvents.length === 0) return;

                    const locationSection = document.createElement('section');
                    locationSection.className = 'event-location-section';

                    const locationHeading = document.createElement('h4');
                    locationHeading.className = 'event-location-heading';
                    locationHeading.textContent = locationLabels[location] || location;
                    locationSection.appendChild(locationHeading);

                    const group = document.createElement('div');
                    group.className = 'grid event-day-grid';

                    locationEvents.forEach(event => {
                        group.appendChild(createEventCard(event));
                    });

                    locationSection.appendChild(group);
                    section.appendChild(locationSection);
                });

                eventGrid.appendChild(section);
            });
        }

        function scrollToEventLocation(locationKey) {
            const locationCard = document.querySelector(
                `[data-event-location="${locationKey}"]`
            );
            if (locationCard) {
                locationCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        renderEventGroups();

        const eventModal = document.getElementById('eventModal');

        function syncEventUrl(eventId) {
            const url = new URL(window.location.href);

            if (eventId) {
                url.searchParams.set('event', eventId);
            } else {
                url.searchParams.delete('event');
            }

            window.history.replaceState({}, '', url);
        }

        function openEventModal(event) {

            document.getElementById('eventModalImage').src =
                event.image;

            document.getElementById('eventModalImage').alt =
                event.name;

            document.getElementById('eventModalTitle').textContent =
                event.name;

            document.getElementById('eventModalProduct').textContent =
                event.product;

            document.getElementById('eventModalTime').textContent =
                event.time || '時間未定';

            document.getElementById('eventModalDescription').textContent =
                event.description;

            document.getElementById('eventModalLocation').textContent =
                event.location || '未定';

            document.getElementById('eventModalMapLink').href =
                `./map.html?map=${encodeURIComponent(event.map || '')}`;

            document.getElementById('eventModalScheduleLink').href =
                `./schedule.html?event=${encodeURIComponent(event.id)}`;

            syncEventUrl(event.id);
            eventModal.style.display = 'flex';
        }

        function closeEventModal() {
            eventModal.style.display = 'none';
            syncEventUrl(null);
        }

        // ×ボタンで閉じる
        eventModalClose.addEventListener('click', () => {
            closeEventModal();
        });


        // 背景クリックで閉じる
        eventModal.addEventListener('click', (event) => {

            if (event.target === eventModal) {
                closeEventModal();
            }

        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && eventModal.style.display === 'flex') {
                closeEventModal();
            }
        });

        const initialEventId = new URLSearchParams(window.location.search).get('event');
        const initialEvent = events.find((event) => event.id === initialEventId);
        const initialLocation = new URLSearchParams(window.location.search).get('location');

        if (initialEvent) {
            openEventModal(initialEvent);
        } else if (initialLocation) {
            scrollToEventLocation(initialLocation);
        }
