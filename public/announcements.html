   お知らせ
========================= */

        .announcement-container {

        .postcard {
            background: #fff;
            border-radius: 12px;
            padding: 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .postcard h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .postcard label {

            margin: 15px 0 6px;
            font-weight: bold;
        }

        .postcard input,
        .postcard textarea,
        .postcard select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .postcard textarea {
            resize: vertical;
            min-height: 140px;
        }

        .postcard select {
            cursor: pointer;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #0078d7;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: .2s;
        }

        .btn:hover {
            background: #005fa3;
        }

        .section-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .char-counter {
            text-align: right;
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
   お知らせ一覧
========================= */

        .announcement-item {
            padding: 15px;
            margin-bottom: 15px;
            border-left: 6px solid #3b82f6;
            background: #fafafa;
            border-radius: 8px;
        }

        .announcement-item h4 {
            margin: 0 0 8px;
        }

        .announcement-item p {
            margin: 0;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .announcement-item small {
            display: block;
            margin-top: 10px;
            color: #777;
        }

        /* 重要度 */

        .announcement-item.normal {
            border-left-color: #3b82f6;
        }

        .announcement-item.important {
            border-left-color: #f59e0b;
            background: #fff8e8;
        }

        .announcement-item.urgent {
            border-left-color: #dc2626;
            background: #fff0f0;
        }

        /* =========================
   管理画面
========================= */

        .manage-item {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            background: white;
        }

        .manage-item h4 {

        }

        .manage-meta {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .manage-actions {

            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-edit {
            background: #f59e0b;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #dc2626;
        }

        .btn-delete:hover {

        }

        /* =========================
   メッセージ
========================= */

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;

        .message.show {

        .message.success {

        /* =========================

========================= */

        <script src="./scripts/tweet.js"></script>

        <script>
            /**
             * アナウンス投稿ボタンのクリックハンドラ
             * - 認証状態を確認
             * - 権限をチェック
             * - 必要に応じてログインページへリダイレクト
             */
            document.addEventListener('DOMContentLoaded', function () {
                const postBtn = document.getElementById('postAnnouncementBtn');
                if (postBtn) {
                    postBtn.addEventListener('click', handlePostButtonClick);
                }
            });

            async function handlePostButtonClick(e) {
                e.preventDefault();

                try {
                    const response = await fetch('/api/auth/check-announcement-access');
                    const data = await response.json();

                    if (data.ok) {
                        // 認証済み＆権限あり → 投稿ページへ遷移
                        console.log('✓ アナウンス投稿権限確認:', data.username, data.role);
                        window.location.href = './announcements-post.html';
                    } else if (response.status === 401) {
                        // 未認証 → ログインページへリダイレクト
                        console.log('✗ 認証なし - ログイン画面へ遷移');
                        window.location.href =
                            "./announcement-login.html?redirect=" +
                            encodeURIComponent("./announcements-post.html");
                    } else if (response.status === 403) {
                        // 権限なし
                        console.log('✗ 権限なし:', data.error);
                        alert('申し訳ありません。お知らせ投稿権限がありません。\n\n管理者にお問い合わせください。');
                    }
                } catch (error) {
                    console.error('アクセス確認エラー:', error);
                    alert('アクセス確認中にエラーが発生しました。');
                }
            }
        </script>
