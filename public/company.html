    <script>

        const exhibitionCompanyList =
            document.getElementById('exhibition-company-list');
        const sponsorCompanyList =
            document.getElementById('sponsor-company-list');
        const companyModal = document.getElementById('company-modal');
        const companyModalBody =
            document.getElementById('company-modal-body');
        const companyModalClose =
            document.querySelector('.company-modal-close');
        const companyModalOverlay =
            document.querySelector('.company-modal-overlay');


        async function loadCompanies() {
            try {
                const response = await fetch('./scripts/companies.json');

                if (!response.ok) {
                    throw new Error('企業データの取得に失敗しました');
                }

                const companies = await response.json();

                companies.forEach(company => {
                    const list = company.exhibition === true
                        ? exhibitionCompanyList
                        : sponsorCompanyList;

                    createCompanyCard(company, list);
                });

                // URLから企業IDを取得
                const params =
                    new URLSearchParams(window.location.search);

                const companyId =
                    params.get("id");


                // IDが指定されている場合
                if (companyId) {

                    const company =
                        companies.find(
                            company => company.id === companyId
                        );

                    if (company) {
                        openCompanyModal(company);
                    }
                }


            } catch (error) {
                console.error(error);

                exhibitionCompanyList.innerHTML =
                    '<p>企業情報を読み込めませんでした。</p>';
                sponsorCompanyList.innerHTML =
                    '<p>企業情報を読み込めませんでした。</p>';
            }
        }




        function createCompanyCard(company, list) {
            const card = document.createElement('article');

            card.className = 'company-card';

            card.innerHTML = `
            <div class="company-card-image">
                <img
                    src="${company.image}"
                    alt="${company.name} ロゴ">
            </div>

            <div class="company-card-body">

                <h3>${formatCompanyName(company.name)}</h3>

                

                <button
                    type="button"
                    class="company-detail-button">
                    詳しく見る
                </button>

            </div>
        `;

            card.querySelector('.company-detail-button')
                .addEventListener('click', () => {
                    openCompanyModal(company);
                });

            list.appendChild(card);
        }


        function formatCompanyName(name) {
            const normalizedName = name.replace(/\s+/g, '');
            const prefix = normalizedName.startsWith('株式会社')
                ? '株式会社'
                : '';
            const suffix = normalizedName.endsWith('株式会社')
                ? '株式会社'
                : '';

            const middleAffixIndex = normalizedName.indexOf('株式会社', prefix.length);
            if (middleAffixIndex !== -1 && !suffix) {
                return `
                    <span class="company-name-body">${normalizedName.slice(0, middleAffixIndex)}</span>
                    <span class="company-name-affix">株式会社</span>
                    <span class="company-name-body">${normalizedName.slice(middleAffixIndex + '株式会社'.length)}</span>
                `;
            }

            const companyBody = normalizedName
                .slice(prefix.length, normalizedName.length - suffix.length);

            if (companyBody.length < 14) {
                return `
                    ${prefix ? `<span class="company-name-affix">${prefix}</span>` : ''}
                    <span class="company-name-body">${companyBody}</span>
                    ${suffix ? `<span class="company-name-affix">${suffix}</span>` : ''}
                `;
            }

            const splitAt = Math.ceil(companyBody.length / 2);
            return `
                ${prefix ? `<span class="company-name-affix">${prefix}</span>` : ''}
                <span class="company-name-body">${companyBody.slice(0, splitAt)}</span>
                <span class="company-name-body">${companyBody.slice(splitAt)}</span>
                ${suffix ? `<span class="company-name-affix">${suffix}</span>` : ''}
            `;
        }


        function openCompanyModal(company) {
            const descriptionSection = company.description === 'none'
                ? ''
                : `
                <section class="company-detail-section">
                    <h3>企業紹介</h3>
                    <p>${company.description}</p>
                </section>
                `;

            companyModalBody.innerHTML = `
            <div class="company-detail">

                <div class="company-detail-header">
                    <img
                        src="${company.image}"
                        alt="${company.name} ロゴ">

                    <h2>${formatCompanyName(company.name)}</h2>

                    
                </div>


                ${descriptionSection}

                
                <section class="company-detail-section company-info">
                    <h3>企業情報</h3>

                    <dl>
                        <dt>所在地</dt>
                        <dd>${company.address}</dd>
                    </dl>
                </section>


                <div class="company-detail-link">
                    <a
                        href="${company.website}"
                        target="_blank"
                        rel="noopener noreferrer">
                        公式サイトを見る
                    </a>
                </div>

            </div>
        `;

            companyModal.classList.add('active');
            document.body.classList.add('modal-open');
        }


        function closeCompanyModal() {
            companyModal.classList.remove('active');
            document.body.classList.remove('modal-open');
        }


        companyModalClose.addEventListener(
            'click',
            closeCompanyModal
        );

        companyModalOverlay.addEventListener(
            'click',
            closeCompanyModal
        );


        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeCompanyModal();
            }
        });


        loadCompanies();
    </script>
