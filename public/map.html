        .map-page {

        /* --------------------------------
   マップタブ
-------------------------------- */

        .map-tabs {
            display: flex;
            gap: 10px;

            margin-bottom: 12px;
        }

        .map-tabs button {
            flex: 1;

            border: none;
            border-radius: 999px;

            padding: 12px;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;

            background: #ddd;
            color: #333;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.1s ease;
        }

        .map-tabs button:hover {
            background: #ccc;
        }

        .map-tabs button:active {
            transform: scale(0.98);
        }

        .map-tabs button.active {
            background: #1aa4e8;
            color: #fff;
        }

        /* --------------------------------
   校舎階層タブ
-------------------------------- */

        .map-floor-tabs {
            display: none;

            gap: 10px;

            margin-top: -2px;
            margin-bottom: 12px;
        }

        .map-floor-tabs.visible {
            display: flex;
        }

        .map-floor-tabs button {
            flex: 1;

            border: none;
            border-radius: 999px;

            padding: 10px;

            font-size: 0.95rem;
            font-weight: bold;

            cursor: pointer;

            background: #e5e7eb;
            color: #333;
        }

        .map-floor-tabs button.active {
            background: #1aa4e8;
            color: #fff;
        }

        /* --------------------------------
   マップ本体
-------------------------------- */

        .map-board {
            background: #8fd0ee;

            border-radius: 32px;

            padding: 16px 16px 18px;

            box-sizing: border-box;
        }

        .map-main {
            width: 100%;

            aspect-ratio: 16 / 9;
            min-height: 300px;

            background: rgb(255, 255, 255);

            border: 2px solid #18354a;

            border-radius: 32px;

            overflow: hidden;

            position: relative;
        }

        /* Leaflet表示領域 */

        .map-container {
            width: 100%;
            height: 100%;
            background: #fff;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container,
        .leaflet-pane,
        .leaflet-tile-pane,
        .leaflet-overlay-pane,
        .leaflet-shadow-pane,
        .leaflet-marker-pane,
        .leaflet-tooltip-pane,
        .leaflet-popup-pane,
        .leaflet-control-container,
        .leaflet-top,
        .leaflet-bottom {
            z-index: 1 !important;
        }

        .leaflet-control,
        .leaflet-control-attribution {
            z-index: 2 !important;
        }

        /* --------------------------------
   ポップアップ
-------------------------------- */

        .map-popup-title {
            margin-bottom: 6px;

            font-size: 1rem;
            font-weight: bold;
        }

        .map-popup-description {
            margin-bottom: 10px;

            color: #475569;
            line-height: 1.5;
        }

        .map-popup-link {
            display: inline-block;

            padding: 8px 12px;

            border-radius: 8px;

            background: #1aa4e8;
            color: #fff;

            text-decoration: none;

            font-weight: 700;
        }

        .map-popup-link:hover {
            opacity: 0.85;
        }

        /* --------------------------------
   スマートフォン
-------------------------------- */

            .map-page {

            }

                gap: 8px;
            }

            }

            .map-floor-tabs {

            }

            /* ------------------------------------------
               ヘルパー
            ------------------------------------------ */

            function normalizeBounds(bounds) {

                const y1 = bounds[0][0];
                const x1 = bounds[0][1];

                const y2 = bounds[1][0];
                const x2 = bounds[1][1];

                return [
                    [
                        Math.min(y1, y2),
                        Math.min(x1, x2)
                    ],
                    [
                        Math.max(y1, y2),
                        Math.max(x1, x2)
                    ]
                ];

            }

            function fitMapToFrame(bounds) {

                if (!bounds) return;

                map.invalidateSize();

                map.setMaxBounds(null);

                map.fitBounds(bounds, {
                    animate: false,
                    padding: [0, 0]
                });

                const baseZoom = map.getZoom();

                map.setMinZoom(baseZoom);

                const defaultZoomOffset = 0.5;
                const targetZoom = baseZoom + defaultZoomOffset;

                const center = [
                    (bounds[0][0] + bounds[1][0]) / 2,
                    (bounds[0][1] + bounds[1][1]) / 2
                ];

                map.setView(center, targetZoom, { animate: false });

                map.setMaxBounds(bounds);

            }

            function clearMap() {

                if (currentOverlay) {
                    map.removeLayer(currentOverlay);
                    currentOverlay = null;
                }

                currentLayers.forEach(layer => {
                    map.removeLayer(layer);
                });

                currentLayers = [];

            }

            function drawAreas(config) {

                if (!config.areas) return;

                config.areas.forEach(area => {

                    const clickableArea = L.rectangle(
                        normalizeBounds(area.bounds),
                        {
                            color: '#1aa4e8',
                            weight: 2,
                            fillColor: '#1aa4e8',
                            fillOpacity: 0.0,//クリック領域の透明度
                            opacity: 0.0//クリック領域の枠線
                        }
                    );

                    clickableArea.addTo(map);

                    clickableArea.on('click', () => {

                        if (area.link) {
                            window.location.href = area.link;
                        }

                    });

                    currentLayers.push(clickableArea);

                });

            }

            /* ------------------------------------------

            function loadMap(key) {

                console.log("loadMap", key);

                const config = mapData[key];

                if (!config) {
                    console.error("マップ設定なし:", key);
                    return;
                }

                const token = ++loadToken;

                currentMapKey = key;

                clearMap();

                const bounds = [
                    [0, 0],
                    [config.height, config.width]
                ];

                currentBounds = bounds;

                console.log("svg =", config.url);
                console.log("bounds =", bounds);

                currentOverlay = L.imageOverlay(
                    config.url,
                    bounds,
                    {
                        interactive: false
                    }
                );

                console.log("overlay =", currentOverlay);
                console.log("L =", L);
                console.log("imageOverlay =", L.imageOverlay);

                currentOverlay.addTo(map);

                    document.getElementById("map").clientWidth,
                    document.getElementById("map").clientHeight
                );

                console.log(
                    "overlay in map =",
                    map.hasLayer(currentOverlay)
                );

                requestAnimationFrame(() => {

                    if (token !== loadToken) {
                        return;
                    }

                    fitMapToFrame(bounds);

                    drawAreas(config);

                });

            }

                }

                    return 'campus';
                }

                if (normalized in mapData) {
                    return normalized;
                }

                if (normalized === 'building') {
                    return 'building1f';
                }

                if (normalized.startsWith('building')) {
                    return normalized;
                }

                if (normalized === 'campus' || normalized === 'stalls') {
                    return normalized;
                }

                return 'campus';

            }

            function applyMapSelection(selectedKey) {

                const buildingKeys = ['building1f', 'building2f', 'building3f', 'building4f'];
                const targetGroup = buildingKeys.includes(selectedKey)
                    ? 'building'
                    : (selectedKey === 'stalls' ? 'stalls' : 'campus');

                tabButtons.forEach(button => {
                    button.classList.toggle(
                        'active',
                        button.dataset.mapGroup === targetGroup
                    );
                });

                if (targetGroup === 'building') {
                    setFloorTabVisible(true);
                    floorButtons.forEach(button => {
                        button.classList.toggle(
                            'active',
                            button.dataset.map === selectedKey
                        );
                    });
                } else {
                    setFloorTabVisible(false);
                    floorButtons.forEach(button => {
                        button.classList.remove('active');
                    });
                }

            }

            function setFloorTabVisible(show) {

                floorTabs.classList.toggle(
                    'visible',
                    show
                );

            }

            function getActiveFloorKey() {

                const active =
                    document.querySelector(
                        '.map-floor-tab.active'
                    );

                return active?.dataset.map || 'building1f';

            }

            tabButtons.forEach(button => {

                button.addEventListener('click', () => {

                    tabButtons.forEach(btn => {
                        btn.classList.remove('active');
                    });

                    button.classList.add('active');

                    const group =
                        button.dataset.mapGroup;

                    if (group === 'building') {

                        setFloorTabVisible(true);

                        loadMap(
                            getActiveFloorKey()
                        );

                    } else {

                        setFloorTabVisible(false);

                        loadMap(
                            groupToMapKey[group]
                        );

                    }

                });

            });

            floorButtons.forEach(button => {

                button.addEventListener('click', () => {

                    floorButtons.forEach(btn => {
                        btn.classList.remove('active');
                    });

                    button.classList.add('active');

                    const buildingTab =
                        document.querySelector(
                            '[data-map-group="building"]'
                        );

                    if (
                        !buildingTab.classList.contains(
                            'active'
                        )
                    ) {
                        return;
                    }

                    loadMap(button.dataset.map);

                });

            });

            /* ------------------------------------------
               リサイズ
            ------------------------------------------ */

            window.addEventListener('resize', () => {

                if (!currentBounds) return;

                fitMapToFrame(currentBounds);

            });

            /* ------------------------------------------
               初期ロード
            ------------------------------------------ */

            const initialMapKey = resolveRequestedMapKey(
                new URLSearchParams(window.location.search).get('map')
            );

            applyMapSelection(initialMapKey);

            window.addEventListener('load', () => {

                loadMap(initialMapKey);

            });

            /* ------------------------------------------
               座標取得（開発用）
            ------------------------------------------ */

            map.on('click', event => {

                console.log(
                    `[${currentMapKey}]`,
                    [
                        Math.round(event.latlng.lat),
                        Math.round(event.latlng.lng)
                    ]
                );

            });

            console.log(
                "svg path =",
                mapData.campus.url
            );


        });

    </script>

</body>

</html>
