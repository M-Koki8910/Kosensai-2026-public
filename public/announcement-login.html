    <style>
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            text-align: center;
            text-decoration: none;

            color: #555;
            background: #f3f3f3;

            border-radius: 6px;

            transition: .2s;
        }

        .back-btn:hover {
            background: #e6e6e6;
        }

        .login-card {
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: none;
            }

        }
    </style>
</head>

        <main>

            <div id="loginScreen" class="login-container">

                <div class="login-card">

                    <h1>📢 お知らせ投稿</h1>

                    <p class="subtitle">
                        お知らせを投稿するにはログインしてください
                    </p>

                    <form id="loginForm">

                        <div class="form-group">
                            <label for="loginUsername">
                                ユーザー名
                            </label>

                            <input type="text" id="loginUsername" placeholder="ユーザー名" autocomplete="username" required>
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">
                                パスワード
                            </label>

                            <input type="password" id="loginPassword" placeholder="パスワード"
                                autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="login-btn">
                            ログイン
                        </button>

                        <a href="./announcements.html" class="back-btn">
                            ← お知らせ一覧へ戻る
                        </a>

                        <div id="loginMessage" class="login-message"></div>

                    </form>

                </div>

            </div>
